<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="asdukw 的个人网站：随笔与技术博客。记录代码、阅读与生活。"
    />
    <meta name="keywords" content="文章, 博客, React, Bun, TypeScript" />
    <meta property="og:title" content="asdukw" />
    <meta
      property="og:description"
      content="随笔与技术博客，记录代码、阅读与生活。"
    />
    <meta name="og:type" content="website" />
    <meta name="theme-color" content="#ffffff" />
    <!-- 不写 type：GitHub 按上传时的原始格式返回头像字节（本账号是 JPEG），
         扩展名和实际格式可能不一致，交给浏览器嗅探。文件由 scripts/fetch-icon.ts 生成。 -->
    <link rel="icon" href="./icon.png" />
    <title>asdukw · 随笔与技术博客</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("site.theme");
          var dark =
            t === "dark" ||
            (t !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#0a0a0a" : "#ffffff");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./frontend.tsx"></script>
  </body>
</html>
