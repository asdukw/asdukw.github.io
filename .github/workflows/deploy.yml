name: Deploy to Cloudflare

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "scripts/**"
      - "worker/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "postcss.config.mjs"
      - "tsconfig.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BUN_PUBLIC_API_BASE: ${{ secrets.BUN_PUBLIC_API_BASE }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build content
        run: bun run build:content
      - name: Check generated content is committed
        run: git diff --exit-code src/generated/posts.ts
      - name: TypeScript typecheck
        run: bun run typecheck
      - name: TypeScript typecheck (worker)
        run: bun run typecheck:worker
      - name: ESLint
        run: bun run lint
      - name: SSR smoke test
        run: bun run smoke
      - run: bun run build
      - name: Deploy to Cloudflare Pages
        run: bun x wrangler pages deploy dist --project-name asdukw --branch master

  deploy-worker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Deploy Worker
        run: bun x wrangler deploy --config worker/wrangler.toml
