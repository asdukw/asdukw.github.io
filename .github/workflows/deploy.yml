name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "postcss.config.mjs"
      - "tsconfig.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BUN_PUBLIC_SUPABASE_URL: ${{ secrets.BUN_PUBLIC_SUPABASE_URL }}
      BUN_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.BUN_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Deploy to Cloudflare Pages
        run: bun x wrangler pages deploy dist --project-name asdukw --branch master
