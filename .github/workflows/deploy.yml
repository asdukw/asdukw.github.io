name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BUN_PUBLIC_AUTH_API_URL: ${{ secrets.BUN_PUBLIC_AUTH_API_URL }}
      BUN_PUBLIC_ADMIN_USER_ID: ${{ secrets.BUN_PUBLIC_ADMIN_USER_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name asdukw --branch master
