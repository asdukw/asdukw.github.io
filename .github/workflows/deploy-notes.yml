name: Deploy notes to Cloudflare Pages

# 独立文档站：notes/ 用 Astro + Starlight 构建，部署到 Cloudflare Pages 项目 asdukw-notes。
#
# 首次使用前：
#   1. 在 Cloudflare 创建 Pages 项目 `asdukw-notes`（direct upload，不需要 Git 集成）。
#   2. 复用现有的 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets（需含 Pages: Edit）。
#   3. 确认下方 push 触发符合预期后，取消注释启用自动部署；否则只能手动触发。
on:
  workflow_dispatch:
  # push:
  #   branches: [master]
  #   paths:
  #     - "notes/**"
  #     - ".github/workflows/deploy-notes.yml"

jobs:
  deploy-notes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: notes
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Deploy to Cloudflare Pages
        run: bun x wrangler pages deploy dist --project-name asdukw-notes --branch master
