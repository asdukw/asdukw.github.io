name: Deploy notes to Cloudflare Pages

# 独立文档站：notes/ 用 Astro + Starlight 构建，部署到 Cloudflare Pages 项目 asdukw-notes。
#
# 首次使用前：
#   1. 在 Cloudflare 创建 Pages 项目 `asdukw-notes`（direct upload，不需要 Git 集成）。
#   2. 复用现有的 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets（需含 Pages: Edit）。
#   3. 已开启 push 自动部署：改 notes/** 推 master 即自动检查、构建、部署。
on:
  push:
    branches: [master]
    paths:
      - "notes/**"
      - ".github/workflows/deploy-notes.yml"
  workflow_dispatch:

jobs:
  deploy-notes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: notes
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          # lastUpdated 依赖完整 git 历史。
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Deploy to Cloudflare Pages
        run: bun x wrangler pages deploy dist --project-name asdukw-notes --branch master
