name: Check FastAPI backend

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

jobs:
  check-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q app alembic
      - name: Lint backend sources
        run: ruff check app alembic scripts
      - name: Import FastAPI application
        run: python -c "from app.main import app; print(app.title)"
      - name: Run backend unit tests
        run: pytest -q
      - name: Validate Alembic PostgreSQL SQL generation
        env:
          DATABASE_URL: postgresql+asyncpg://migration-check:password@localhost:5432/asdukw
        run: alembic upgrade head --sql > migration.sql
